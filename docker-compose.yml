services:
  postgres:
    image: postgres:15
    container_name: recovery-system-postgres
    environment:
      POSTGRES_DB: recovery_system
      POSTGRES_USER: recovery_app
      POSTGRES_PASSWORD: recovery_app
    ports:
      - "5432:5432"
    volumes:
      - recovery_system_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery_app -d recovery_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recovery_system_pgdata:
