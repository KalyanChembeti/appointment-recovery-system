# Keep production's every-minute Spring Session cleanup unchanged while preventing
# cached Testcontainers contexts from running cleanup jobs during ordinary test JVMs.
spring.session.jdbc.cleanup-cron=0 0 0 1 1 *

# Let each context perform its initial worker poll against its live database, then keep
# cached Testcontainers contexts from polling again after their containers have stopped.
recovery-system.worker.recovery-poll-interval-ms=86400000
recovery-system.worker.offer-expiry-poll-interval-ms=86400000
